display_information:
  name: AGY Slack Bridge
  description: Connects Slack messages and forwards them to Antigravity (AGY)
  background_color: "#1f2937"
features:
  bot_user:
    display_name: AGY Bridge
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - chat:write.public
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  socket_mode_enabled: true
