packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  better-sqlite3: set this to true or false
  esbuild: set this to true or false

# pnpm 11 otherwise auto-runs `pnpm install` before scripts when a pnpm 9
# node_modules tree is present. Dependency installation stays an explicit
# bootstrap/CI step; validation commands must never mutate the workspace.
verifyDepsBeforeRun: false
