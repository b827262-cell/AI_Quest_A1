server {
    listen 80;
    server_name _;

    root /opt/AI-Stu-R1/dist;
    index index.html;

    # PWA metadata and worker must be served as files, never through the SPA
    # fallback. HTTPS on the Tailscale hostname is required for registration.
    location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; add_header Cache-Control "no-cache"; }
    location = /sw.js { default_type application/javascript; try_files $uri =404; add_header Cache-Control "no-cache"; }
    # Installed PWA share POSTs are intercepted by sw.js, which stores the
    # multipart form locally before returning the SPA shell. Keep a safe SPA
    # fallback for browsers without an active worker; never rewrite body data
    # into a query string.
    location = /share-target { try_files $uri /index.html; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Student and shared APIs are served by the verified central API endpoint.
    location /api/student/ {
        proxy_pass http://100.76.46.86:4300/api/student/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/appearance-settings {
        proxy_pass http://100.76.46.86:4300/api/appearance-settings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Public, read-only B3 catalog contract; it has no student-session or
    # admin-token requirement and reads PostgreSQL exam_courses only.
    location ^~ /api/public/exam-courses/ {
        proxy_pass http://127.0.0.1:4360;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Keep uploads (especially PDFs) coming from central storage/API only.
    location ^~ /api/uploads/ {
        proxy_pass http://100.76.46.86:4300/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Explicitly avoid serving student PDFs from the local box.
    location ^~ /uploads/books/ {
        add_header X-Blocked-By smartbook-1gb-nginx always;
        return 404;
    }
}
