server {
    listen 80;
    server_name _;

    root /opt/AI-Stu-R1/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Student and shared APIs are served by the verified central API endpoint.
    location /api/student/ {
        proxy_pass http://100.76.46.86:4300/api/student/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/appearance-settings {
        proxy_pass http://100.76.46.86:4300/api/appearance-settings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Keep uploads (especially PDFs) coming from central storage/API only.
    location ^~ /api/uploads/ {
        proxy_pass http://100.76.46.86:4300/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Explicitly avoid serving student PDFs from the local box.
    location ^~ /uploads/books/ {
        add_header X-Blocked-By smartbook-1gb-nginx always;
        return 404;
    }
}
