server {
    listen 443 ssl http2;
    server_name admin.example.com;

    root /opt/AI-Quest-A1/apps/AI-adm-D1/dist;
    index index.html;

    # TLS certificate directives are supplied by the host's certificate
    # manager. The application must only be exposed through HTTPS in
    # production because the session and CSRF cookies are Secure.

    location /api/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;

        # Browser traffic uses the revocable HttpOnly session. Never inject
        # a permanent admin token, and do not forward token headers that a
        # public browser attempted to supply.
        proxy_set_header X-Admin-Token "";
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:4300/health/live;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:4300/health/ready;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

